[KillCam]
; Master switch (1/0)
Enabled=1
; Probability (0-100) that a qualifying kill triggers the killcam
ChancePercent=100
; Minimum real seconds between killcams
CooldownSec=15
; Real seconds of slow motion
DurationSec=2.0
; Slow motion. VaryTimeScale=1 picks a random value in [TimeScaleMin, TimeScaleMax] for each killcam;
; VaryTimeScale=0 always uses TimeScale. Valid range 0.05-1.0.
VaryTimeScale=1
TimeScaleMin=0.10
TimeScaleMax=0.40
TimeScale=0.25
; Trigger conditions (either one is enough)
TriggerOnHeadshot=1
TriggerOnOneShot=1
; Values returned by GET_CHAR_LAST_DAMAGE_BONE that count as "head" (comma separated, decimal or 0x).
; Default 1205 = 0x4B5 = BONE_HEAD from the IV-SDK .NET bone enum; not tested in-game.
; Check the log ("player kill: ... bone N") after a headshot and fix this if it differs.
HeadBoneIds=1205
; Camera shot, picked at random for every killcam (weights are relative, not percentages).
; Movement: fixed camera (most common), orbit (random direction and speed), slow dolly in/out.
WeightStatic=60
WeightOrbit=30
WeightDolly=10
; Angle: eye level, high angle (looking down), low angle (near the ground, looking slightly up).
WeightEyeLevel=45
WeightHighAngle=30
WeightLowAngle=25
; Distance from the victim (meters), orbit speed range (deg/s), dolly size (fraction of the distance),
; height range of the high angle above the victim, field of view.
RadiusMin=2.5
RadiusMax=4.5
OrbitSpeedMin=6
OrbitSpeedMax=22
DollyAmount=0.30
HighAngleHeightMin=2.2
HighAngleHeightMax=4.0
CamFov=45
; Chance (%) that an ordinary firearm kill (no headshot, not a one-shot kill) also triggers a killcam.
BodyKillChancePercent=5
; Chance (%) that a kill by explosion (grenade, molotov, rocket, RPG, explosions you caused) gets a killcam.
; Explosion shots are filmed from farther away (ExplosionDist*, meters), never from a low angle.
ExplosionKillChancePercent=4
ExplosionDistMin=7
ExplosionDistMax=12
; Killcams for NPCs inside cars/bikes. The camera is always in front of the vehicle, looking back at the
; victim, and follows the vehicle. Distance ahead and height above the vehicle are random in these ranges.
VehicleKills=1
VehicleDistMin=4
VehicleDistMax=6.5
VehicleHeightMin=0.8
VehicleHeightMax=2.0
; Freeze the gameplay camera (your aim) while the killcam plays, so moving the mouse does not change where
; you are aiming when it ends. 0 = off.
LockAimDuringKillcam=1
; How: 1 = disable the gameplay camera controls, 2 = switch player control off (you cannot move, shoot or look
; for the 2 seconds), 3 = both. If the aim still moves, try 2 or 3; if you dislike being frozen, use 1.
LockAimMethod=3
; Kills made with these weapon ids (headshot or one-shot kills) use SniperChancePercent and SniperCooldownSec
; instead of ChancePercent and CooldownSec, and are allowed up to SniperMaxDistance meters away. 16 = sniper rifle, 17 = M40A1.
; Episodic sniper weapons are not listed: their ids are unverified (add them here if you know them).
SniperWeaponIds=16,17
SniperChancePercent=100
SniperCooldownSec=7
SniperMaxDistance=250
; Ignore victims farther than this from the player (meters)
MaxVictimDistance=60
; Write GTAIV_KillCam.log next to the .asi
Log=1

[LineOfSight]
; Exact raycast (CWorld::ProcessLineOfSight). No verified pattern exists for 1.2.0.59, so this is
; empty by default and the camera check falls back to terrain probes only (walls NOT detected).
; If you find the function, put a byte pattern of its entry here; it must match exactly once.
RaycastPattern=
RaycastOffset=0
; 142 = statics | buildings | vehicles | objects
RaycastFlags=142

[DeadEye]
; Hold the key to slow the world; the player keeps moving, aiming and reloading at about PlayerSpeed
; of normal speed, so NPCs are slower than you. Does not run while a killcam is playing.
Enabled=1
; Virtual-key code: 164 = Left Alt (next to the Windows key), 165 = Right Alt, 160 = Left Shift, 20 = Caps Lock.
; Shift is used by the game to run, so it is not the default.
Key=164
; 0 = hold, 1 = press once to turn on, again to turn off
Toggle=0
; World time scale while active (0.05-1.0)
TimeScale=0.25
; Player speed relative to normal (1.0 = full speed, 0.85 = a little slower than normal)
PlayerSpeed=0.85
; Cap for the player's animation speed multiplier (PlayerSpeed / TimeScale is clamped to this)
MaxAnimSpeed=4.0
; Real seconds to blend the slow motion in and out
RampSec=0.15
; How the player is kept fast: 1 = SET_CHAR_ALL_ANIMS_SPEED, 2 = SET_CHAR_MOVE_ANIM_SPEED_MULTIPLIER,
; 0 = none (the player slows down with the world)
PlayerSpeedMethod=1

; Energy meter. A full meter lasts MaxSeconds of Dead Eye. After you release (or it runs dry) the meter
; waits RechargeDelaySec, then refills over RechargeSeconds (for an empty meter). If it runs dry it
; cannot be started again until it has refilled to MinToStart (fraction, 0-1).
MaxSeconds=10
RechargeDelaySec=1
RechargeSeconds=20
MinToStart=0.2
; Headshot kills refill this fraction of a full meter (0 = off).
HeadshotRefill=0.15
; On-screen text meter drawn with the game's own text natives (white = ready, yellow = in use,
; red = ran dry), left-aligned at HudX/HudY (screen fractions, 0-1). HudAlways=0 hides it while the meter
; is full and idle. HudScale is the text size.
Hud=1
HudAlways=0
HudX=0.058
HudY=0.955
HudScale=0.20
