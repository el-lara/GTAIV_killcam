[KillCam]
; Master switch (1/0)
Enabled=1
; Probability (0-100) that a qualifying kill triggers the killcam
ChancePercent=100
; Minimum real seconds between killcams
CooldownSec=15
; Real seconds of slow motion
DurationSec=2.0
; SET_TIME_SCALE value during the killcam (0.05-1.0)
TimeScale=0.25
; Trigger conditions (either one is enough)
TriggerOnHeadshot=1
TriggerOnOneShot=1
; Values returned by GET_CHAR_LAST_DAMAGE_BONE that count as "head" (comma separated).
; UNVERIFIED default: check the log ("player kill: ... bone N") after a headshot and fix this.
HeadBoneIds=1301
; Camera: orbit radius, height above victim, look-at height, FOV, orbit speed (deg/s, 0 = static)
CamRadius=3.0
CamHeight=0.6
TargetHeight=0.3
CamFov=45
OrbitDegPerSec=25
; Ignore victims farther than this from the player (meters)
MaxVictimDistance=60
; Write GTAIV_KillCam.log next to the .asi
Log=1
